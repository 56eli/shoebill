<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>shoebill — wall</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- pure mosaic — no chrome, just pictures -->
  <div id="grid" class="grid" aria-live="polite"></div>
  <div id="empty" class="empty hidden">no shoebills yet</div>

  <!-- lightbox -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Image preview">
    <button id="lightbox-close" class="lightbox-close" aria-label="Close">×</button>
    <div class="lightbox-bg"></div>
    <img id="lightbox-img" alt="shoebill enlarged" />
  </div>

  <script src="script.js"></script>
</body>
</html>
